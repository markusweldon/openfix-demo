# Policy for the example app. See docs/policy.md for every option.
version: 1
default_action: propose

rules:
  - name: secrets need rotation, not a code change
    match: { category: [secrets] }
    action: skip
  - name: code findings
    match: { category: [sast], min_severity: low }
    action: autofix

guards:
  max_files_changed: 3
  max_lines_changed: 80

models:
  author: anthropic:claude-opus-5-5
  # reviewer: openai:gpt-5

verify:
  require: [rescan, tests, regression_test]
  tests: { command: "node --test test/*.test.js" }
  setup: { command: "true" }          # the unit tests need no npm install
  scanner:
    # Each finding is rescanned by the scanner that reported it. Semgrep uses the local rules so the
    # demo runs offline; Snyk Code findings use the snyk-code preset (needs `snyk auth` or SNYK_TOKEN).
    semgrep:
      command: "semgrep scan --config .semgrep.yml --sarif --output {output} --metrics off --quiet --disable-version-check src"
    snyk-code: snyk-code

sandbox:
  backend: auto
